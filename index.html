<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e1116">
<meta name="description" content="平板专注工作台：番茄钟 + 待办 + 时间块，纯本地离线运行。">
<title>专注工作台 FocusDesk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="decor" aria-hidden="true">
  <div class="blob b1" data-shift></div>
  <div class="blob b2" data-shift></div>
  <div class="blob b3" data-shift></div>
</div>

<header class="topbar">
  <div class="brand"><span class="brand-dot"></span><b>专注工作台</b><span class="brand-sub">FocusDesk</span></div>
  <div class="topbar-actions">
    <span id="wakeStatus" class="chip chip-warn" title="屏幕常亮状态">屏幕常亮：检查中…</span>
    <button id="btnInstall" class="btn ghost hidden" type="button">安装到桌面</button>
    <button id="btnExport" class="btn ghost" type="button">导出备份</button>
    <button id="btnImport" class="btn ghost" type="button">导入备份</button>
    <button id="btnSettings" class="btn ghost" type="button">设置</button>
    <input id="fileImport" type="file" accept="application/json,.json" hidden>
  </div>
</header>

<main class="grid">
  <section class="col col-left">
    <div class="card clock-card">
      <div class="clock-inner" data-shift-slow>
        <div id="nowTime" class="now-time">--:--</div>
        <div id="nowDate" class="now-date">----年--月--日 周-</div>
      </div>
    </div>

    <div class="card pomo-card" id="pomoCard">
      <div class="card-head">
        <h2>番茄钟</h2>
        <span id="pomoPhase" class="phase-pill phase-focus">专注</span>
      </div>
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-bg" cx="60" cy="60" r="54"></circle>
          <circle id="ringFg" class="ring-fg" cx="60" cy="60" r="54"></circle>
        </svg>
        <div class="ring-center">
          <div id="pomoTime" class="pomo-time">25:00</div>
          <div id="pomoRunState" class="pomo-state">未开始</div>
        </div>
      </div>
      <div class="pomo-controls">
        <button id="btnStart" class="btn primary" type="button">开始专注</button>
        <button id="btnSkip" class="btn ghost" type="button">跳过</button>
        <button id="btnEnd" class="btn ghost" type="button">结束本阶段</button>
      </div>
      <div class="pomo-task">
        <label class="lbl" for="pomoTask">当前专注任务</label>
        <select id="pomoTask" class="select"><option value="">（未选择）</option></select>
      </div>
      <div class="pomo-meta">
        <span>今日专注 <b id="statCount">0</b> 次</span>
        <span>累计 <b id="statMin">0</b> 分钟</span>
        <span>已完成 <b id="pomoCycle">0</b> 轮</span>
      </div>
    </div>
  </section>

  <section class="col col-mid">
    <div class="card todo-card">
      <div class="card-head">
        <h2>待办事项</h2>
        <span id="todoCount" class="muted">0</span>
      </div>
      <form id="todoForm" class="todo-add" autocomplete="off">
        <input id="todoInput" class="input" type="text" placeholder="添加任务，回车确认" maxlength="120">
        <button class="btn primary" type="submit">添加</button>
      </form>
      <div class="filters" id="todoFilters">
        <button class="filter active" data-filter="all" type="button">全部</button>
        <button class="filter" data-filter="active" type="button">未完成</button>
        <button class="filter" data-filter="done" type="button">已完成</button>
      </div>
      <ul id="todoList" class="todo-list"></ul>
      <p class="hint">双击任务可改名；点「专注」把它设为当前番茄任务。</p>
    </div>
  </section>

  <section class="col col-main">
    <div class="card timeline-card">
      <div class="card-head">
        <h2>时间块</h2>
        <div class="date-nav">
          <button id="btnPrevDay" class="btn ghost small" type="button">‹ 前一日</button>
          <input id="dayPicker" class="input date" type="date">
          <button id="btnNextDay" class="btn ghost small" type="button">后一日 ›</button>
          <button id="btnToday" class="btn ghost small" type="button">今天</button>
        </div>
      </div>
      <div class="timeline-scroll" id="timelineScroll">
        <div class="timeline" id="timeline">
          <div class="tl-hours" id="tlHours"></div>
          <div class="tl-track" id="tlTrack"></div>
        </div>
      </div>
      <p class="hint">空白处点击＝新建 1 小时；按住拖动＝自定义时段；拖动任务块可移动，拖上下边缘可改时长。</p>
    </div>
  </section>
</main>

<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toasts" class="toasts"></div>

<script src="app.js"></script>
</body>
</html>
